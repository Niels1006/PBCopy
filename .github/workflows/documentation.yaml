name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for gh-pages

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v1

      - name: Install Julia dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build Julia docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl

      # JS docs
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: |
          npm install jsdoc
          npm install clean-jsdoc-theme

      - name: Generate JS docs
        run: npx jsdoc --configure jsdoc.json

      # Deploy JS docs to gh-pages branch
      - name: Deploy JS docs to gh-pages
        if: github.repository == 'your-org/your-repo'  # only deploy from main repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages

          # Copy new JS docs into docs/js (overwrite existing)
          rm -rf docs/js
          mkdir -p docs/js
          cp -r path/to/generated/jsdocs/* docs/js/  # adjust this path

          git add docs/js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update JS docs"
            git push origin gh-pages
          fi
